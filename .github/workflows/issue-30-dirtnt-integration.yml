name: Issue 30 DirTNT runtime integration

on:
  pull_request:
    branches:
      - ver/26.2
    paths:
      - .github/workflows/issue-30-dirtnt-integration.yml
      - src/main/java/org/cardboardpowered/RegistryUtil.java
      - src/main/java/org/bukkit/craftbukkit/entity/CraftEntityType.java
      - src/main/java/org/bukkit/craftbukkit/entity/CraftEntityTypes.java
      - src/main/java/org/bukkit/craftbukkit/entity/CraftEntity.java
      - src/main/java/org/cardboardpowered/mixin/bukkit/entity/CraftEntityMixin.java
      - src/main/resources/cardboard-modded-entity-fix.mixins.json
      - src/main/resources/fabric.mod.json
      - src/test/java/org/cardboardpowered/RegistryUtilTest.java
  push:
    branches:
      - ver/26.2
    paths:
      - .github/workflows/issue-30-dirtnt-integration.yml
      - src/main/java/org/cardboardpowered/RegistryUtil.java
      - src/main/java/org/bukkit/craftbukkit/entity/CraftEntityType.java
      - src/main/java/org/bukkit/craftbukkit/entity/CraftEntityTypes.java
      - src/main/java/org/bukkit/craftbukkit/entity/CraftEntity.java
      - src/main/java/org/cardboardpowered/mixin/bukkit/entity/CraftEntityMixin.java
      - src/main/resources/cardboard-modded-entity-fix.mixins.json
      - src/main/resources/fabric.mod.json
      - src/test/java/org/cardboardpowered/RegistryUtilTest.java
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dirtnt-runtime:
    name: DirTNT custom entity smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out Cardboard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check out DirTNT 26.2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Fourmisain/DirTNT
          ref: '26.2'
          path: dirtnt
          persist-credentials: false

      - name: Set up Temurin JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Build DirTNT 26.2
        shell: bash
        run: |
          set -euo pipefail
          cd dirtnt
          ./gradlew clean build --no-daemon
          ls -lh build/libs

      - name: Prepare Cardboard dev server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run/mods
          dirtnt_jar="$(find dirtnt/build/libs -maxdepth 1 -type f -name 'DirTNT-*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n 1)"
          if [[ -z "$dirtnt_jar" ]]; then
            echo '::error::DirTNT runtime JAR was not produced'
            exit 1
          fi
          cp "$dirtnt_jar" run/mods/
          printf 'eula=true\n' > run/eula.txt
          cat > run/server.properties <<'EOF'
          online-mode=false
          level-name=issue30-world
          spawn-protection=0
          view-distance=4
          simulation-distance=4
          EOF
          echo "Using DirTNT JAR: $dirtnt_jar"

      - name: Start server and verify DirTNT custom entity
        shell: bash
        run: |
          set -euo pipefail
          log="$GITHUB_WORKSPACE/issue30-server.log"
          pipe="$GITHUB_WORKSPACE/issue30-server-input"
          rm -f "$pipe"
          mkfifo "$pipe"

          ./gradlew runServer --no-daemon < "$pipe" > "$log" 2>&1 &
          server_pid=$!
          exec 3>"$pipe"

          cleanup() {
            if kill -0 "$server_pid" 2>/dev/null; then
              printf 'stop\n' >&3 || true
              sleep 2
              kill "$server_pid" 2>/dev/null || true
            fi
            exec 3>&- || true
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 180); do
            if grep -qE 'Done \([0-9.]+s\)!|Done \(' "$log"; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo '::error::Server exited before startup completed'
              cat "$log"
              exit 1
            fi
            sleep 1
          done

          if [[ "$ready" != 1 ]]; then
            echo '::error::Server did not become ready within 180 seconds'
            tail -n 300 "$log"
            exit 1
          fi

          # Issue #30 is about Cardboard handling a Fabric-registered EntityType.
          # Test the block registry separately, then create the custom entity
          # directly so the smoke test does not depend on redstone timing or
          # DirTNT's block-priming implementation.
          printf 'forceload add 0 0\n' >&3
          printf 'setblock 0 100 0 dirtnt:sand_tnt\n' >&3
          printf 'execute if block 0 100 0 dirtnt:sand_tnt run say ISSUE30_DIRTNT_BLOCK_PRESENT\n' >&3
          printf 'summon dirtnt:sand_tnt 0.5 101 0.5\n' >&3
          printf 'execute if entity @e[type=dirtnt:sand_tnt,limit=1] run say ISSUE30_DIRTNT_ENTITY_PRESENT\n' >&3
          printf 'kill @e[type=dirtnt:sand_tnt]\n' >&3
          sleep 3

          if ! kill -0 "$server_pid" 2>/dev/null; then
            echo '::error::Server crashed while spawning the DirTNT custom entity'
            tail -n 400 "$log"
            exit 1
          fi

          if grep -qE 'No Bukkit EntityType mapping|CraftEntityType.*IllegalArgumentException|AssertionError: Unknown entity.*fourmisain\.dirtnt|Unknown entity class fourmisain\.dirtnt|Encountered an unexpected exception' "$log"; then
            echo '::error::Detected the custom EntityType crash signature'
            tail -n 400 "$log"
            exit 1
          fi

          if ! grep -q 'Registered modded "dirtnt:sand_tnt" as CraftEntity' "$log"; then
            echo '::error::DirTNT sand_tnt was not registered in the Bukkit entity registry'
            tail -n 400 "$log"
            exit 1
          fi

          if ! grep -q 'ISSUE30_DIRTNT_BLOCK_PRESENT' "$log"; then
            echo '::error::DirTNT sand_tnt block was not available at runtime'
            tail -n 400 "$log"
            exit 1
          fi

          if ! grep -q 'ISSUE30_DIRTNT_ENTITY_PRESENT' "$log"; then
            echo '::error::DirTNT sand_tnt custom entity could not be spawned or selected'
            tail -n 400 "$log"
            exit 1
          fi

          echo 'DirTNT custom block/entity registered, spawned, and Cardboard stayed alive.'
          printf 'stop\n' >&3
          wait "$server_pid"
          trap - EXIT
          exec 3>&-

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-30-dirtnt-runtime-log-${{ github.run_id }}
          path: issue30-server.log
          if-no-files-found: ignore
          retention-days: 7
