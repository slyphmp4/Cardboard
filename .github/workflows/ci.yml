name: Cardboard CI

on:
  pull_request:
    branches:
      - ver/26.2
  push:
    branches:
      - ver/26.2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cardboard-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cardboard:
    name: Cardboard build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Temurin JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/ver/26.2' }}

      - name: Build and test Cardboard
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: Upload Cardboard JAR
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cardboard-${{ github.sha }}
          path: build/libs/Cardboard-*.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload Cardboard failure reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cardboard-failure-reports-${{ github.run_id }}
          path: |
            build/reports/tests/**
            build/test-results/**
            build/reports/problems/**
          if-no-files-found: ignore
          retention-days: 7

  nightcore-compatibility:
    name: NightCore 2.16.4 + ExcellentEnchants 5.4.3 smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out Cardboard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Temurin JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Prepare NightCore server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run/plugins
          ./gradlew -p tools/torture/plugin jar --no-daemon
          cp tools/torture/plugin/build/libs/cardboard-torture-plugin-1.0.0.jar run/plugins/
          printf 'eula=true\n' > run/eula.txt
          cat > run/server.properties <<'EOF'
          online-mode=false
          level-name=nightcore-nbt-smoke
          spawn-protection=0
          view-distance=3
          simulation-distance=3
          pause-when-empty-seconds=0
          EOF
          curl --fail --location --retry 3 \
            https://api.modrinth.com/maven/maven/modrinth/Y4NRwMW5/vDmXDRvE/Y4NRwMW5-vDmXDRvE.jar \
            --output run/plugins/nightcore-2.16.4.jar
          echo '0449d8700b41f13a458caedb68f9959db35f89d01ea05ef0d0907812484aa8ab  run/plugins/nightcore-2.16.4.jar' | sha256sum --check
          curl --fail --location --retry 3 \
            https://cdn.modrinth.com/data/QufNAmjx/versions/AT68K28Z/ExcellentEnchants-5.4.3.jar \
            --output run/plugins/ExcellentEnchants-5.4.3.jar
          echo '01991c6dcf3030e736db69b9d5fd49ac6ab030d3c09feabdf1bd7674d9570133  run/plugins/ExcellentEnchants-5.4.3.jar' | sha256sum --check

      - name: Run NightCore compatibility smoke
        shell: bash
        run: |
          set -euo pipefail
          log="$GITHUB_WORKSPACE/nightcore-compatibility.log"
          pipe="$GITHUB_WORKSPACE/nightcore-compatibility-input"
          rm -f "$pipe"
          mkfifo "$pipe"

          ./gradlew runServer --no-daemon < "$pipe" > "$log" 2>&1 &
          server_pid=$!
          exec 3>"$pipe"

          cleanup() {
            if kill -0 "$server_pid" 2>/dev/null; then
              printf 'stop\n' >&3 || true
              sleep 2
              kill "$server_pid" 2>/dev/null || true
            fi
            exec 3>&- || true
          }
          trap cleanup EXIT

          result=timeout
          for _ in $(seq 1 240); do
            if grep -Eq 'Could not initialize NBT Utils|ConfigCodecs is not initialized|No suitable driver|Error occurred while enabling nightcore|Error occurred while enabling ExcellentEnchants|Error occurred while enabling CardboardTorture|Could not load.*CardboardTorture|Failed to run bootstrapper|Mixin apply failed' "$log"; then
              result=fail
              break
            fi
            if grep -q 'Done (' "$log" && grep -Eq 'Cardboard registry .*enchantment.* registered [1-9][0-9]* entries during compose' "$log" && grep -q 'Enabling ExcellentEnchants' "$log" && grep -q 'CardboardTorture ready' "$log"; then
              result=pass
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              result=exit
              break
            fi
            sleep 1
          done

          grep -Ei 'nightcore|ExcellentEnchants|CardboardTorture|Bukkit plugins|Cardboard registry|Server version detected|Could not initialize NBT Utils|ConfigCodecs|No suitable driver|Plugin loaded in' "$log" || true

          if [[ "$result" == pass ]]; then
            printf 'stop\n' >&3
            wait "$server_pid"
            if grep -Eq 'Error occurred while enabling nightcore|Error occurred while enabling ExcellentEnchants|Error occurred while enabling CardboardTorture|Failed to run bootstrapper' "$log"; then
              echo '::error::Plugin startup failed after the server reported ready'
              tail -n 300 "$log"
              exit 1
            fi
            trap - EXIT
            exec 3>&-
            exit 0
          fi

          echo "::error::NightCore compatibility smoke result: $result"
          tail -n 300 "$log"
          exit 1

      - name: Upload NightCore smoke log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightcore-compatibility-${{ github.run_id }}
          path: nightcore-compatibility.log
          if-no-files-found: ignore
          retention-days: 7

  reproducible-build:
    name: Reproducible Cardboard JAR
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out build A
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: checkout-a
          persist-credentials: false
          fetch-depth: 0

      - name: Check out build B
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: checkout-b
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Temurin JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/ver/26.2' }}

      - name: Test reproducibility verifier
        run: >-
          python3 -B -m unittest discover
          -s checkout-a/tools/reproducibility/tests
          -p 'test_*.py'
          -v

      - name: Build twice and compare canonical JARs
        run: >-
          python3 checkout-a/tools/reproducibility/verify.py
          --second-checkout checkout-b

      - name: Upload reproducibility failure report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reproducibility-failure-${{ github.run_id }}
          path: checkout-a/build/reports/reproducibility/**
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7

  torture-harness:
    name: Torture harness build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Temurin JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/ver/26.2' }}

      - name: Build and test torture plugin
        run: ./gradlew -p tools/torture/plugin clean build --no-daemon --stacktrace

      - name: Compile-check Python tooling
        run: python3 -m py_compile tools/torture/run.py tools/torture/tests/test_run.py

      - name: Test Python tooling and checked-in scenarios
        shell: bash
        run: |
          mkdir -p tools/torture/reports
          python3 -m unittest discover -s tools/torture/tests -p 'test_*.py' -v 2>&1 \
            | tee tools/torture/reports/ci-python-tests.log

      - name: Upload torture plugin JAR
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cardboard-torture-plugin-${{ github.sha }}
          path: tools/torture/plugin/build/libs/cardboard-torture-plugin-*.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload torture harness failure reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: torture-harness-failure-reports-${{ github.run_id }}
          path: |
            tools/torture/plugin/build/reports/tests/**
            tools/torture/plugin/build/test-results/**
            tools/torture/plugin/build/reports/problems/**
            tools/torture/reports/ci-python-tests.log
          if-no-files-found: ignore
          retention-days: 7
