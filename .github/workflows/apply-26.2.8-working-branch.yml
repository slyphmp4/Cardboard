name: Apply 26.2.8 patch to working branch

on:
  push:
    branches:
      - ver/26.2
    paths:
      - .github/workflows/apply-26.2.8-working-branch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/inventory-click-player-null-packet
          fetch-depth: 0

      - name: Apply fixes
        shell: python
        run: |
          from pathlib import Path

          inventory_path = Path('src/main/java/org/cardboardpowered/mixin/server/network/ServerGamePacketListenerImplMixin_InventoryClickEvent.java')
          text = inventory_path.read_text()
          old_import = 'import org.cardboardpowered.bridge.world.inventory.AbstractContainerMenuBridge;\n'
          new_import = ('import org.cardboardpowered.bridge.world.inventory.AbstractContainerMenuBridge;\n'
                        'import org.cardboardpowered.bridge.server.level.ServerPlayerBridge;\n'
                        'import org.cardboardpowered.impl.inventory.CustomInventoryView;\n'
                        'import org.bukkit.entity.HumanEntity;\n')
          assert old_import in text
          text = text.replace(old_import, new_import, 1)

          old_view = '''        InventoryView inventory = ((AbstractContainerMenuBridge) player.containerMenu).getBukkitView();

        InventoryType.SlotType type = inventory.getSlotType(packet.slotNum());
'''
          new_view = '''        InventoryView inventory = ((AbstractContainerMenuBridge) player.containerMenu).getBukkitView();

        // Generic/modded menus can fall back to CustomInventoryView without a
        // player attached. Bukkit InventoryClickEvent derives getWhoClicked()
        // and the bottom inventory from the view player, so attach the real
        // ServerPlayer before plugins see the event.
        if (inventory.getPlayer() == null) {
            HumanEntity bukkitPlayer = (HumanEntity) ((ServerPlayerBridge) (Object) this.player).getBukkitEntity();
            if (bukkitPlayer == null) {
                ci.cancel();
                return;
            }
            inventory = new CustomInventoryView(bukkitPlayer, inventory.getTopInventory(), this.player.containerMenu);
        }

        InventoryType.SlotType type = inventory.getSlotType(packet.slotNum());
'''
          assert old_view in text
          text = text.replace(old_view, new_view, 1)
          inventory_path.write_text(text)

          gamemode_path = Path('src/main/java/org/cardboardpowered/mixin/server/level/ServerPlayerGameModeMixin.java')
          text = gamemode_path.read_text()
          old_cancel = '''            BlockEntity tileentity = this.level.getBlockEntity(pos);
            if (tileentity != null) {
                this.player.connection.send(tileentity.getUpdatePacket());
            }
            ci.cancel();
'''
          new_cancel = '''            BlockEntity tileentity = this.level.getBlockEntity(pos);
            if (tileentity != null) {
                var updatePacket = tileentity.getUpdatePacket();
                if (updatePacket != null) {
                    this.player.connection.send(updatePacket);
                }
            }
            // The client will usually follow a cancelled START destroy action
            // with ABORT for the same position. Keep the tracked position in
            // sync while explicitly leaving block destruction inactive.
            this.destroyPos = pos;
            this.isDestroyingBlock = false;
            ci.cancel();
'''
          assert old_cancel in text
          text = text.replace(old_cancel, new_cancel, 1)

          old_break_cancel = '''            BlockEntity tileentity = this.level.getBlockEntity(blockposition);
            if (tileentity != null)
                this.player.connection.send(tileentity.getUpdatePacket());

            ci.setReturnValue(false);
'''
          new_break_cancel = '''            BlockEntity tileentity = this.level.getBlockEntity(blockposition);
            if (tileentity != null) {
                var updatePacket = tileentity.getUpdatePacket();
                if (updatePacket != null) {
                    this.player.connection.send(updatePacket);
                }
            }

            ci.setReturnValue(false);
'''
          assert old_break_cancel in text
          text = text.replace(old_break_cancel, new_break_cancel, 1)
          gamemode_path.write_text(text)

          gradle = Path('gradle.properties')
          text = gradle.read_text()
          assert 'mod_version = 26.2.7' in text
          gradle.write_text(text.replace('mod_version = 26.2.7', 'mod_version = 26.2.8', 1))

          version_test = Path('src/test/java/org/cardboardpowered/GitVersionTest.java')
          text = version_test.read_text()
          assert 'assertEquals("26.2.7", GitVersion.VERSION);' in text
          version_test.write_text(text.replace('assertEquals("26.2.7", GitVersion.VERSION);', 'assertEquals("26.2.8", GitVersion.VERSION);', 1))

          release = Path('docs/releases/v26.2.8.md')
          release.write_text('''# Cardboard 26.2.8

Cardboard 26.2.8 fixes Bukkit inventory events for generic/modded menus and a block-inspection packet crash.

## Fixes

- Attaches the real Bukkit player to fallback `CustomInventoryView` instances before constructing `InventoryClickEvent`.
- Prevents `InventoryClickEvent#getWhoClicked()` from being null for modded menus such as Storage Delight cabinets.
- Restores a valid bottom player inventory on fallback inventory views, preventing `CraftInventoryView#getBottomInventory()` NPEs.
- Never sends a null `BlockEntity#getUpdatePacket()` when a plugin cancels a left-click/block-break interaction.
- Keeps the cancelled destroy position synchronized so the following client abort packet does not report a mismatched block position.

## Validation target

- Minecraft 26.2
- Fabric Loader 0.19.3
- CoreProtect 24.0
- CoreProtectModdedContainers 1.0.0
- Storage Delight 26.7.1-26.2-fabric
- JDK 25
''')

      - name: Commit patch to working branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main/java/org/cardboardpowered/mixin/server/network/ServerGamePacketListenerImplMixin_InventoryClickEvent.java \
                  src/main/java/org/cardboardpowered/mixin/server/level/ServerPlayerGameModeMixin.java \
                  gradle.properties src/test/java/org/cardboardpowered/GitVersionTest.java docs/releases/v26.2.8.md
          git commit -m 'Fix modded inventory click player and block update packets'
          git push origin HEAD:fix/inventory-click-player-null-packet
