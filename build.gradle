configure([tasks.compileJava]) {
    sourceCompatibility = 25
    options.release = 25

    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

processResources {
    inputs.property "version", project.version

	duplicatesStrategy = DuplicatesStrategy.INCLUDE
    from(sourceSets.main.resources.srcDirs) {
        include "fabric.mod.json"
        // Always expand: leaving the literal ${version} in fabric.mod.json makes
        // Fabric Loader warn that the version is unparseable on every start.
        expand "version": project.mod_version
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude "fabric.mod.json"
    }
}

tasks.withType(JavaCompile) {
	options.encoding = "UTF-8"
	options.deprecation = false
	options.compilerArgs << '-Xlint:-deprecation'
	options.compilerArgs << '-Xlint:-removal'
	options.compilerArgs << '-Xlint:-dep-ann'
	options.compilerArgs << '-XDignore.symbol.file'
	
	println(options.compilerArgs)
}

jar {
	duplicatesStrategy = DuplicatesStrategy.WARN
    destinationDirectory = layout.buildDirectory.dir('intermediates/loomJar')
    from "LICENSE"
    from {
        (configurations.extraLibs - configurations.removeLibs).filter{ it.exists() }.collect { it.isDirectory() ? it : zipTree(it) }
    }
    exclude("**/mojang-translations/")
}

loom.nestJars(tasks.named("jar"), configurations.nestedMods)

def reproducibleJar = tasks.register('reproducibleJar', Zip) {
    group = 'build'
    description = 'Repackages the Loom JAR with deterministic entry order and timestamps.'
    dependsOn(tasks.named('jar'))
    archiveBaseName = project.archives_base_name
    archiveVersion = project.mod_version
    archiveExtension = 'jar'
    destinationDirectory = layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.FAIL
    // Keep the manifest first for JarInputStream while sorting every other entry.
    from({ zipTree(tasks.named('jar').get().archiveFile.get().asFile) }) {
        include 'META-INF/MANIFEST.MF'
    }
    from({ zipTree(tasks.named('jar').get().archiveFile.get().asFile) }) {
        exclude 'META-INF/MANIFEST.MF'
    }
}

tasks.named('assemble') {
    dependsOn(reproducibleJar)
}

shadowJar {
    configurations = [project.configurations.api]
    dependencies {
      exclude(dependency('com.mojang:minecraft:*'))
      exclude(dependency('org.objectweb:asm:*'))
      exclude(dependency('com.google.guava:guava:*'))
