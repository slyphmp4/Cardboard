@CacheableTask
abstract class GenerateGitVersion extends DefaultTask {
    @Input
    abstract Property<String> getMavenGroupValue()

    @Input
    abstract Property<String> getMavenNameValue()

    @Input
    abstract Property<String> getProjectVersionValue()

    @Input
    abstract Property<Integer> getGitRevision()

    @Input
    abstract Property<String> getGitSha()

    @Input
    abstract Property<Long> getGitCommitEpochSeconds()

    @Input
    abstract Property<String> getGitBranchValue()

    @Input
    abstract Property<Integer> getGitDirty()

    @OutputFile
    abstract RegularFileProperty getOutputFile()

    private static String javaString(String value) {
        return value.replace('\\', '\\\\').replace('"', '\\"')
    }

    @TaskAction
    void generate() {
        long commitEpochSeconds = gitCommitEpochSeconds.get()
        String commitDate = Instant.ofEpochSecond(commitEpochSeconds).toString()
        long commitEpochMillis = Math.multiplyExact(commitEpochSeconds, 1000L)
        String indent = '\t'
        String content = [
            'package org.cardboardpowered;',
            '',
            '/**',
            ' * Deterministic source revision information generated by Gradle.',
            ' */',
            'public final class GitVersion {',
            "${indent}public static final String MAVEN_GROUP = \"${javaString(mavenGroupValue.get())}\";",
            "${indent}public static final String MAVEN_NAME = \"${javaString(mavenNameValue.get())}\";",
            "${indent}public static final String VERSION = \"${javaString(projectVersionValue.get())}\";",
            "${indent}public static final int GIT_REVISION = ${gitRevision.get()};",
            "${indent}public static final String GIT_SHA = \"${javaString(gitSha.get())}\";",
            "${indent}public static final String GIT_DATE = \"${commitDate}\";",
            "${indent}public static final String GIT_BRANCH = \"${javaString(gitBranchValue.get())}\";",
            "${indent}public static final String BUILD_DATE = \"${commitDate}\";",
            "${indent}public static final long BUILD_UNIX_TIME = ${commitEpochMillis}L;",
            "${indent}public static final int DIRTY = ${gitDirty.get()};",
            '',
            "${indent}private GitVersion() {}",
            '}',
            ''
        ].join('\n')

        File target = outputFile.get().asFile
        Files.createDirectories(target.toPath().parent)
        if (!target.exists() || Files.readString(target.toPath(), StandardCharsets.UTF_8) != content) {
            Files.writeString(target.toPath(), content, StandardCharsets.UTF_8)
        }
    }
}

version = project.mod_version
group = project.maven_group

def gitOutput = { String... arguments ->
    providers.exec {
        workingDir = rootDir
        commandLine(['git'] + arguments.toList())
    }.standardOutput.asText.map { it.trim() }
}

def generatedGitVersion = tasks.register('generateGitVersion', GenerateGitVersion) {
    mavenGroupValue = project.maven_group
    mavenNameValue = rootProject.name
    projectVersionValue = project.mod_version
    gitRevision = gitOutput('rev-list', '--no-show-signature', '--count', 'HEAD').map { Integer.parseInt(it) }
    gitSha = gitOutput('rev-parse', 'HEAD')
    gitCommitEpochSeconds = gitOutput('show', '--no-show-signature', '-s', '--format=%ct', 'HEAD').map { Long.parseLong(it) }
    gitBranchValue = project.git_version_branch
    gitDirty = gitOutput('status', '--porcelain=v1', '--untracked-files=normal')
        .map { it.isEmpty() ? 0 : 1 }
    outputFile = layout.buildDirectory.file('generated/sources/gitVersion/java/org/cardboardpowered/GitVersion.java')
}

sourceSets {
    main {
        java.srcDir(layout.buildDirectory.dir('generated/sources/gitVersion/java'))
    }
}

tasks.named('compileJava') {
    dependsOn(generatedGitVersion)
}

