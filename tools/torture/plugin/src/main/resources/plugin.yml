name: CardboardTorture
version: 1.0.0
main: org.cardboardpowered.torture.CardboardTorturePlugin
load: POSTWORLD
commands:
  cardboardtorture:
    description: Run isolated Cardboard post-release torture workloads
    usage: |-
      /cardboardtorture start [seconds] [stability|scheduler|api|entity|chunks|saturation]
      /cardboardtorture prepare <chunks|entity>
      /cardboardtorture <status|stop|profiles>
    permission: cardboard.torture.admin
permissions:
  cardboard.torture.admin:
    description: Allows Cardboard torture workload control
    default: op
