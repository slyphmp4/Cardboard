[defaults]
host = "127.0.0.1"
port = 25565
connect_timeout_seconds = 3
sample_interval_seconds = 5

[smoke]
duration_seconds = 180
connections = 10
connect_rate_per_second = 2
reconnect = true

[burst]
duration_seconds = 900
connections = 100
connect_rate_per_second = 20
reconnect = true

[soak]
duration_seconds = 21600
connections = 50
connect_rate_per_second = 5
reconnect = true

[limits]
max_unexpected_disconnect_ratio = 0.10
max_connect_failure_ratio = 0.05
max_process_rss_growth_mb = 1024
max_error_lines = 0
