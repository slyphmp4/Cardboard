[defaults]
host = "127.0.0.1"
port = 25565
# STATUS state does not require the login protocol version to match; zero keeps
# the runner independent from protocol-number tables while still exercising
# the real Minecraft handshake and status packet parser.
protocol_version = 0
connect_timeout_seconds = 3
sample_interval_seconds = 5

[smoke]
duration_seconds = 180
connections = 10
connect_rate_per_second = 2
reconnect = true

[burst]
duration_seconds = 900
connections = 100
connect_rate_per_second = 20
reconnect = true

[soak]
duration_seconds = 21600
connections = 50
connect_rate_per_second = 5
reconnect = true

[limits]
max_connect_failure_ratio = 0.05
max_protocol_failure_ratio = 0.01
max_heap_after_full_gc_growth_mb = 512
max_error_lines = 0
